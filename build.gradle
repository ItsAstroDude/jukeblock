plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'org.jetbrains.kotlin.jvm' version "${kotlin_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	mavenCentral()

	// Where `slimJna` drops the trimmed JNA. Loom's `include` only accepts a resolved
	// module — it rejects a plain file dependency for having no capabilities — so the
	// output has to be reachable as coordinates rather than as a path.
	ivy {
		url = file("${buildDir}/slim-jna-out").toURI()
		patternLayout {
			artifact "[artifact]-[revision].[ext]"
		}
		metadataSources { artifact() }
		// Scoped, so this repository is never consulted for anything else.
		content { includeModule("jukeblock.slim", "jna") }
	}
}

loom {
	// Client-side only mod: no split source sets, everything lives in `main`.
	mods {
		"jukeblock" {
			sourceSet sourceSets.main
		}
	}
}

// Diagnostic harness for the media layer, run outside Minecraft. Kept out of the mod
// jar — it exists so the SMTC bridge can be exercised without a game launch.
sourceSets {
	smoke {
		compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
		runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
	}
}

// JNA ships jnidispatch for two dozen platforms — about 5 MB of natives, of which
// Jukeblock can only ever use one. The mod is Windows-only by construction (SMTC has no
// equivalent elsewhere), so the rest is repackaged out before the jar is nested.
//
// The generated fabric.mod.json deliberately matches what Loom's own `include` produces,
// id and version included: if another mod nests JNA too, Fabric still sees one library
// at one version rather than two copies of the same classes.
configurations {
	jnaFull
}

def jnaMetadata = tasks.register("jnaMetadata") {
	description = "Writes the fabric.mod.json for the trimmed JNA jar."

	def output = layout.buildDirectory.file("slim-jna/fabric.mod.json")
	def jnaVersion = project.jna_version
	outputs.file(output)

	doLast {
		def file = output.get().asFile
		file.parentFile.mkdirs()
		file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
			schemaVersion: 1,
			id           : "net_java_dev_jna_jna",
			version      : jnaVersion,
			name         : "jna",
			custom       : ["fabric-loom:generated": true],
		]))
	}
}

tasks.register("slimJna", Zip) {
	description = "Repackages JNA with only the Windows x64 native."
	group = "build"

	archiveFileName = "jna-${project.jna_version}.jar"
	destinationDirectory = layout.buildDirectory.dir("slim-jna-out")

	// The mod jar is a release artifact, so keep this byte-stable: a timestamp that moves
	// every build makes it impossible to tell whether anything actually changed.
	preserveFileTimestamps = false
	reproducibleFileOrder = true
	// Otherwise every emptied platform folder survives as a bare directory entry.
	includeEmptyDirs = false

	// Resolved in a closure so the configuration isn't resolved at configuration time.
	from({ zipTree(configurations.jnaFull.singleFile) }) {
		exclude { it.path.contains("jnidispatch") && !it.path.startsWith("com/sun/jna/win32-x86-64/") }
	}
	from(jnaMetadata)
}

// Nothing links the Ivy repository above to the task that fills it, so say it outright:
// without this the include resolves before the jar exists, on a clean checkout.
tasks.named("processIncludeJars") {
	dependsOn tasks.named("slimJna")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	implementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"

	// Bridge to the native SMTC cdylib. Nested through `slimJna` rather than `include`,
	// for the reason given above that task.
	implementation "net.java.dev.jna:jna:${project.jna_version}"
	jnaFull "net.java.dev.jna:jna:${project.jna_version}"
	include "jukeblock.slim:jna:${project.jna_version}"

	// Optional at runtime: config button in ModMenu, screen built with Cloth Config.
	// Compiled against local jars for the same reason EnderPocket does — the
	// TerraformersMC maven kept failing mid-download, and in the no-remap era release
	// jars are directly usable.
	compileOnly files("libs/modmenu-20.0.1.jar")
	compileOnly files("libs/cloth-config-26.2.155.jar")
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Rebuilds the native SMTC bridge and refreshes the copy under src/main/resources.
//
// The built DLL is committed to the repo on purpose: it keeps `gradlew build` working
// without a Rust toolchain, which matters for CI and for anyone who just wants to
// compile the mod. Run this task after changing anything under native/.
tasks.register("buildNative", Exec) {
	description = "Compiles native/smtc-bridge and copies the DLL into src/main/resources."
	group = "build"

	workingDir = file("native/smtc-bridge")
	commandLine "cargo", "build", "--release"

	doLast {
		copy {
			from "native/smtc-bridge/target/release/smtc_bridge.dll"
			into "src/main/resources/win32-x86-64"
		}
	}
}

tasks.register("smoke", JavaExec) {
	description = "Exercises the media layer from a plain JVM, without launching Minecraft."
	group = "verification"

	dependsOn tasks.named("smokeClasses")
	classpath = sourceSets.smoke.runtimeClasspath
	mainClass = "dev.astro.jukeblock.smoke.MediaSmoke"

	// JavaExec would otherwise use the Gradle daemon's JVM, which is older than the
	// release-25 bytecode Loom's toolchain produces.
	javaLauncher = javaToolchains.launcherFor {
		languageVersion = JavaLanguageVersion.of(25)
	}

	// JNA's System.load is a restricted method on JDK 25; without this the run is
	// buried in warnings. The mod itself gets the same treatment via fabric.mod.json.
	jvmArgs "--enable-native-access=ALL-UNNAMED"

	// The bridge speaks UTF-8; without this the Windows console mangles anything
	// non-ASCII and it looks like a decoding bug that isn't there.
	jvmArgs "-Dstdout.encoding=UTF-8", "-Dstderr.encoding=UTF-8"
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

kotlin {
	compilerOptions {
		jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_25
	}
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName" }
	}
}
