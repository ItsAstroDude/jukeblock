[package]
name = "smtc_bridge"
version = "0.1.0"
edition = "2021"
description = "Flat C ABI bridge over the Windows System Media Transport Controls, for Jukeblock."
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1.0"

[dependencies.windows]
version = "0.62"
features = [
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# NOT panic = "abort": a panic must never take the JVM down with it.
# Every exported fn wraps its body in catch_unwind instead.
panic = "unwind"
